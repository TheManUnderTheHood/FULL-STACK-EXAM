spring.application.name=event-management-system
# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/event_management_db
# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600
# JWT Configuration
jwt.secret=your-super-secret-key-change-this-in-production-must-be-at-least-32-characters
jwt.expiration=86400000
# Server Configuration
server.port=8080
server.servlet.context-path=/api
# Logging Configuration
logging.level.root=INFO
logging.level.com.eventmanagement=DEBUG
